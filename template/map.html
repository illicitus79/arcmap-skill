<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{PROJECT_NAME}} — Architecture Map</title>
<style>
  /* ── Design tokens ──────────────────────────────────────────────────────── */
  :root,
  html[data-theme="dark"] {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #232736;
    --border: #2d3148; --text: #e2e4ed; --text-dim: #8b8fa3;
    --accent: #6366f1; --accent-glow: rgba(99,102,241,.15);
    --green: #10b981; --amber: #f59e0b; --purple: #8b5cf6;
    --red: #ef4444; --orange: #f97316; --cyan: #06b6d4;
    --zone-fill: rgba(255,255,255,.02); --zone-stroke: rgba(255,255,255,.06);
    --zone-label: rgba(255,255,255,.2); --edge-label-bg: #0f1117;
    --shadow: 0 8px 24px rgba(0,0,0,.3);
    --overlay-bg: rgba(15,17,23,.75);
    --radius: 12px; --transition: .2s cubic-bezier(.4,0,.2,1);
  }
  html[data-theme="light"] {
    --bg: #f6f7fb; --surface: #ffffff; --surface2: #eef0f6;
    --border: #d7dae4; --text: #1a1d27; --text-dim: #5b6074;
    --accent: #5457e8; --accent-glow: rgba(84,87,232,.12);
    --green: #0a8f63; --amber: #c67600; --purple: #7a4cda;
    --red: #d1392e; --orange: #d9651a; --cyan: #0898b2;
    --zone-fill: rgba(0,0,0,.02); --zone-stroke: rgba(0,0,0,.08);
    --zone-label: rgba(0,0,0,.35); --edge-label-bg: #ffffff;
    --shadow: 0 6px 18px rgba(30,32,50,.08);
    --overlay-bg: rgba(246,247,251,.85);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; overflow-x:hidden; }

  /* Header */
  .header { position:sticky; top:0; z-index:100; background:var(--overlay-bg); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); padding:12px 22px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .header-logo { width:34px; height:34px; background:linear-gradient(135deg,var(--accent),var(--purple)); border-radius:8px; display:grid; place-items:center; font-weight:700; font-size:15px; flex-shrink:0; color:#fff; }
  .header h1 { font-size:16px; font-weight:600; white-space:nowrap; }
  .header h1 span { color:var(--text-dim); font-weight:400; margin-left:8px; font-size:12px; }
  .view-toggle { display:flex; gap:3px; background:var(--surface); border-radius:8px; padding:3px; border:1px solid var(--border); }
  .view-toggle button { background:none; border:none; color:var(--text-dim); padding:5px 12px; border-radius:6px; font-size:12px; cursor:pointer; transition:all var(--transition); white-space:nowrap; font-family:inherit; }
  .view-toggle button.active { background:var(--accent); color:#fff; }
  .header-actions { display:flex; gap:6px; align-items:center; margin-left:auto; }
  .icon-btn { background:var(--surface); border:1px solid var(--border); color:var(--text-dim); width:32px; height:32px; border-radius:7px; display:grid; place-items:center; cursor:pointer; font-size:14px; transition:all var(--transition); font-family:inherit; }
  .icon-btn:hover { color:var(--text); border-color:var(--accent); }
  .search-box { position:relative; }
  .search-box::before { content:'⌕'; position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text-dim); font-size:14px; pointer-events:none; }
  .search-box input { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:7px 11px 7px 30px; color:var(--text); font-size:13px; width:240px; outline:none; transition:border-color var(--transition); font-family:inherit; }
  .search-box input:focus { border-color:var(--accent); }

  /* Stats */
  .stats-bar { display:flex; gap:18px; padding:9px 22px; background:var(--surface); border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .stat { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim); }
  .stat-value { font-weight:700; color:var(--text); font-size:14px; }

  /* Filter bar (shown in graph/diagram views) */
  .filter-bar { display:none; padding:8px 22px; background:var(--surface); border-bottom:1px solid var(--border); flex-wrap:wrap; gap:6px; align-items:center; font-size:11px; color:var(--text-dim); }
  .filter-bar.visible { display:flex; }
  .filter-chip { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; border:1px solid var(--border); background:var(--bg); cursor:pointer; user-select:none; transition:all var(--transition); }
  .filter-chip.off { opacity:.4; }
  .filter-chip:hover { border-color:var(--accent); }
  .filter-swatch { width:10px; height:2px; border-radius:1px; }

  /* Layout */
  .app { display:flex; height:calc(100vh - 89px); }
  .sidebar { width:280px; min-width:280px; border-right:1px solid var(--border); overflow-y:auto; background:var(--surface); }
  .main { flex:1; overflow-y:auto; padding:20px 26px; position:relative; }

  /* Sidebar */
  .sidebar-section { padding:12px; border-bottom:1px solid var(--border); }
  .sidebar-section h3 { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); margin-bottom:8px; }
  .proj-item { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:7px; cursor:pointer; transition:background var(--transition); margin-bottom:2px; border:1px solid transparent; }
  .proj-item:hover { background:var(--surface2); }
  .proj-item.active { background:var(--accent-glow); border-color:var(--accent); }
  .proj-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .proj-name { font-size:12px; font-weight:500; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .proj-type { font-size:10px; color:var(--text-dim); background:var(--bg); padding:2px 6px; border-radius:4px; }

  /* Architecture cards */
  .arch-summary { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:24px; font-size:13px; color:var(--text-dim); line-height:1.7; }
  .arch-summary strong { color:var(--text); }
  .layer-section { margin-bottom:26px; }
  .layer-label { display:inline-flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:5px 13px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--text-dim); margin-bottom:12px; }
  .layer-dot { width:7px; height:7px; border-radius:50%; }
  .project-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
  .project-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; cursor:pointer; transition:all var(--transition); position:relative; overflow:hidden; }
  .project-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--card-color,var(--accent)); }
  .project-card:hover { border-color:var(--card-color,var(--accent)); transform:translateY(-2px); box-shadow:var(--shadow); }
  .card-header { display:flex; align-items:flex-start; gap:10px; margin-bottom:9px; }
  .card-icon { width:36px; height:36px; border-radius:8px; display:grid; place-items:center; font-size:16px; flex-shrink:0; }
  .card-title { font-size:14px; font-weight:600; }
  .card-subtitle { font-size:11px; color:var(--text-dim); margin-top:2px; }
  .card-desc { font-size:12px; color:var(--text-dim); line-height:1.6; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .card-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; }
  .card-tag { font-size:10px; padding:2px 7px; border-radius:4px; background:var(--bg); color:var(--text-dim); border:1px solid var(--border); }

  /* Data Flow */
  .flow-container { max-width:820px; display:flex; flex-direction:column; gap:18px; }
  .flow-item { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; display:flex; align-items:flex-start; gap:14px; transition:border-color var(--transition); }
  .flow-item:hover { border-color:var(--accent); }
  .flow-arrow { display:flex; flex-direction:column; align-items:center; gap:4px; flex-shrink:0; min-width:100px; }
  .flow-node { font-size:10px; font-weight:600; padding:4px 9px; border-radius:5px; background:var(--bg); border:1px solid var(--border); text-align:center; white-space:nowrap; cursor:pointer; }
  .flow-node:hover { border-color:var(--accent); }
  .flow-line { width:2px; height:16px; background:var(--accent); position:relative; }
  .flow-line::after { content:'▼'; position:absolute; bottom:-7px; left:50%; transform:translateX(-50%); font-size:7px; color:var(--accent); }
  .flow-proto { font-size:9px; font-weight:600; color:var(--accent); text-transform:uppercase; letter-spacing:.5px; }
  .flow-desc { font-size:12px; color:var(--text-dim); line-height:1.6; flex:1; }
  .flow-desc strong { color:var(--text); }

  /* Endpoints view */
  .endpoint-toolbar { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .endpoint-toolbar input { background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:6px 10px; color:var(--text); font-size:12px; outline:none; width:220px; font-family:inherit; }
  .endpoint-toolbar input:focus { border-color:var(--accent); }
  .endpoint-table { width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
  .endpoint-table th, .endpoint-table td { padding:9px 12px; text-align:left; font-size:12px; border-bottom:1px solid var(--border); vertical-align:top; }
  .endpoint-table th { background:var(--surface2); color:var(--text-dim); font-weight:600; font-size:10px; text-transform:uppercase; letter-spacing:.5px; }
  .endpoint-table tr:last-child td { border-bottom:none; }
  .endpoint-table tr:hover { background:var(--surface2); }
  .method-pill { display:inline-block; padding:2px 7px; border-radius:4px; font-size:10px; font-weight:700; font-family:'Cascadia Code','Fira Code',monospace; }
  .method-pill.GET    { background:rgba(16,185,129,.15); color:var(--green); }
  .method-pill.POST   { background:rgba(99,102,241,.15); color:var(--accent); }
  .method-pill.PUT    { background:rgba(245,158,11,.15); color:var(--amber); }
  .method-pill.PATCH  { background:rgba(139,92,246,.15); color:var(--purple); }
  .method-pill.DELETE { background:rgba(239,68,68,.15); color:var(--red); }
  .method-pill.ANY    { background:var(--surface2); color:var(--text-dim); }
  .endpoint-path { font-family:'Cascadia Code','Fira Code',monospace; font-size:11px; color:var(--text); }

  /* Detail panel */
  .detail-panel { position:fixed; top:89px; right:0; width:480px; height:calc(100vh - 89px); background:var(--surface); border-left:1px solid var(--border); z-index:50; transform:translateX(100%); transition:transform .3s cubic-bezier(.4,0,.2,1); overflow-y:auto; box-shadow:-8px 0 32px rgba(0,0,0,.3); }
  .detail-panel.open { transform:translateX(0); }
  .detail-header { position:sticky; top:0; z-index:10; background:var(--surface); border-bottom:1px solid var(--border); padding:16px 20px; display:flex; align-items:center; gap:12px; }
  .detail-close { width:30px; height:30px; border-radius:7px; background:var(--bg); border:1px solid var(--border); color:var(--text-dim); display:grid; place-items:center; cursor:pointer; font-size:15px; transition:all var(--transition); font-family:inherit; }
  .detail-close:hover { color:var(--text); border-color:var(--text-dim); }
  .detail-content { padding:20px; }
  .detail-section { margin-bottom:20px; }
  .detail-section-title { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--border); }
  .detail-desc { font-size:12px; color:var(--text-dim); line-height:1.7; margin-bottom:12px; }
  .detail-link-btn { padding:6px 12px; background:var(--bg); border:1px solid var(--border); border-radius:7px; cursor:pointer; font-size:12px; font-family:inherit; transition:all var(--transition); }
  .detail-link-btn:hover { border-color:var(--accent); }

  /* File items */
  .file-item { background:var(--bg); border:1px solid var(--border); border-radius:7px; margin-bottom:6px; overflow:hidden; transition:border-color var(--transition); }
  .file-item:hover { border-color:var(--accent); }
  .file-header { display:flex; align-items:center; gap:9px; padding:9px 12px; cursor:pointer; user-select:none; }
  .file-icon { font-size:13px; color:var(--text-dim); }
  .file-name { font-size:12px; font-weight:500; font-family:'Cascadia Code','Fira Code',monospace; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file-cat { font-size:9px; font-weight:600; padding:2px 7px; border-radius:3px; text-transform:uppercase; letter-spacing:.3px; flex-shrink:0; }
  .file-cat.Model      { background:rgba(99,102,241,.15); color:#818cf8; }
  .file-cat.Service    { background:rgba(16,185,129,.15); color:#34d399; }
  .file-cat.Interface  { background:rgba(139,92,246,.15); color:#a78bfa; }
  .file-cat.Endpoint   { background:rgba(245,158,11,.15); color:#fbbf24; }
  .file-cat.Worker     { background:rgba(249,115,22,.15); color:#fb923c; }
  .file-cat.Contract   { background:rgba(236,72,153,.15); color:#f472b6; }
  .file-cat.Data       { background:rgba(6,182,212,.15); color:#22d3ee; }
  .file-cat.Security   { background:rgba(239,68,68,.15); color:#f87171; }
  .file-cat.Middleware { background:rgba(168,85,247,.15); color:#c084fc; }
  .file-cat.Configuration { background:rgba(107,114,128,.15); color:#9ca3af; }
  .file-cat.Seeding    { background:rgba(20,184,166,.15); color:#2dd4bf; }
  .file-cat.Handler    { background:rgba(249,115,22,.15); color:#fb923c; }
  .file-cat.Messaging  { background:rgba(236,72,153,.15); color:#f472b6; }
  .file-cat.Test       { background:rgba(107,114,128,.15); color:#9ca3af; }
  .file-chevron { font-size:11px; color:var(--text-dim); transition:transform var(--transition); }
  .file-item.expanded .file-chevron { transform:rotate(90deg); }
  .file-body { display:none; padding:0 12px 12px; border-top:1px solid var(--border); }
  .file-item.expanded .file-body { display:block; }
  .file-desc { font-size:11px; color:var(--text-dim); line-height:1.6; margin:9px 0; }

  /* Classes */
  .class-item { display:flex; align-items:flex-start; gap:7px; padding:5px 0; border-bottom:1px dashed var(--border); }
  .class-item:last-child { border-bottom:none; }
  .class-badge { font-size:8px; font-weight:700; padding:2px 5px; border-radius:3px; text-transform:uppercase; white-space:nowrap; flex-shrink:0; margin-top:2px; }
  .class-badge.class     { background:rgba(16,185,129,.15); color:#34d399; }
  .class-badge.interface { background:rgba(139,92,246,.15); color:#a78bfa; }
  .class-badge.enum      { background:rgba(245,158,11,.15); color:#fbbf24; }
  .class-badge.record    { background:rgba(236,72,153,.15); color:#f472b6; }
  .class-badge.abstract  { background:rgba(6,182,212,.15); color:#22d3ee; }
  .class-badge.sealed    { background:rgba(239,68,68,.15); color:#f87171; }
  .class-badge.static    { background:rgba(107,114,128,.15); color:#9ca3af; }
  .class-badge.trait     { background:rgba(139,92,246,.15); color:#a78bfa; }
  .class-badge.struct    { background:rgba(6,182,212,.15); color:#22d3ee; }
  .class-info { flex:1; min-width:0; }
  .class-name { font-size:11px; font-weight:600; font-family:'Cascadia Code','Fira Code',monospace; }
  .class-desc { font-size:10px; color:var(--text-dim); margin-top:2px; }

  /* Methods */
  .method-list { margin-top:9px; }
  .method-list-title { font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--text-dim); margin-bottom:5px; }
  .method-item { padding:5px 7px; background:var(--accent-glow); border-radius:4px; margin-bottom:3px; border-left:2px solid var(--accent); }
  .method-sig { font-size:10px; font-weight:500; font-family:'Cascadia Code','Fira Code',monospace; color:var(--accent); word-break:break-all; }
  .method-desc { font-size:10px; color:var(--text-dim); margin-top:2px; }

  /* Deps */
  .dep-section { margin-top:10px; }
  .dep-label { font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--text-dim); margin-bottom:5px; }
  .dep-chips { display:flex; flex-wrap:wrap; gap:3px; }
  .dep-chip { font-size:10px; padding:2px 7px; border-radius:3px; background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); }
  .dep-chip.out { border-left:2px solid var(--green); }
  .dep-chip.in  { border-left:2px solid var(--amber); }

  /* Connections */
  .conn-item { background:var(--bg); border:1px solid var(--border); border-radius:7px; padding:10px 12px; margin-bottom:6px; }
  .conn-nodes { display:flex; align-items:center; gap:7px; margin-bottom:5px; flex-wrap:wrap; }
  .conn-node { font-size:11px; font-weight:600; padding:3px 9px; border-radius:5px; background:var(--surface2); cursor:pointer; }
  .conn-node:hover { background:var(--accent-glow); }
  .conn-type { font-size:9px; font-weight:600; color:var(--accent); text-transform:uppercase; letter-spacing:.5px; }
  .conn-desc { font-size:11px; color:var(--text-dim); line-height:1.5; margin-top:5px; }

  /* Patterns */
  .pattern-item { display:flex; align-items:center; gap:7px; padding:5px 0; }
  .pattern-dot { width:5px; height:5px; border-radius:50%; background:var(--accent); }
  .pattern-name { font-size:12px; }

  /* Graph / infra common */
  .svg-viewport { width:100%; height:calc(100vh - 170px); position:relative; overflow:hidden; background:radial-gradient(circle at center,var(--accent-glow) 0%,transparent 70%); border-radius:var(--radius); border:1px solid var(--border); }
  .svg-viewport svg { width:100%; height:100%; cursor:grab; display:block; }
  .svg-viewport svg.grabbing { cursor:grabbing; }
  .graph-node { cursor:pointer; transition:opacity var(--transition); }
  .graph-node.dim { opacity:.2; }
  .graph-node circle, .graph-node rect { transition:stroke-width var(--transition); }
  .graph-node:hover circle, .graph-node:hover rect { stroke-width:3; }
  .graph-node text { fill:var(--text); font-size:10px; font-weight:600; text-anchor:middle; pointer-events:none; }
  .graph-edge { stroke-width:1.5; fill:none; transition:opacity var(--transition),stroke-width var(--transition); }
  .graph-edge.dim { opacity:.1; }
  .graph-edge.highlight { stroke-width:3; opacity:1 !important; }
  .graph-edge-label { fill:var(--text-dim); font-size:9px; text-anchor:middle; pointer-events:none; transition:opacity var(--transition); }
  .graph-edge-label.dim { opacity:.1; }
  .graph-overlay { position:absolute; bottom:12px; left:12px; background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:9px 13px; font-size:10px; color:var(--text-dim); }
  .legend-item { display:flex; align-items:center; gap:7px; margin-bottom:4px; }
  .legend-item:last-child { margin-bottom:0; }
  .legend-line { width:22px; height:2px; flex-shrink:0; }
  .zoom-controls { position:absolute; top:12px; right:12px; display:flex; flex-direction:column; gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:4px; }
  .zoom-btn { background:var(--bg); border:1px solid var(--border); color:var(--text); width:26px; height:26px; border-radius:5px; cursor:pointer; font-size:13px; font-weight:700; display:grid; place-items:center; transition:all var(--transition); font-family:inherit; }
  .zoom-btn:hover { border-color:var(--accent); color:var(--accent); }

  /* Infra diagram */
  .infra-zone { fill:var(--zone-fill); stroke:var(--zone-stroke); stroke-width:1; }
  .infra-zone-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; fill:var(--zone-label); }
  .inode { cursor:pointer; }
  .inode-box { rx:9; stroke-width:1.5; }
  .inode:hover .inode-box { filter:brightness(1.25); }
  .inode-icon { font-size:16px; dominant-baseline:middle; text-anchor:middle; }
  .inode-title { font-size:10px; font-weight:700; dominant-baseline:middle; text-anchor:middle; fill:#fff; }
  html[data-theme="light"] .inode-title { fill:var(--text); }
  .inode-sub { font-size:8px; dominant-baseline:middle; text-anchor:middle; fill:rgba(255,255,255,.55); }
  html[data-theme="light"] .inode-sub { fill:var(--text-dim); }
  .iedge { fill:none; stroke-width:1.5; transition:opacity var(--transition); }
  .iedge.dim { opacity:.1; }
  .iedge-label { font-size:8px; font-weight:600; text-anchor:middle; dominant-baseline:middle; fill:var(--text-dim); }

  /* Modal */
  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:200; display:none; align-items:center; justify-content:center; padding:24px; }
  .modal-backdrop.open { display:flex; }
  .modal { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); max-width:540px; width:100%; max-height:80vh; overflow-y:auto; padding:22px; box-shadow:var(--shadow); }
  .modal h2 { font-size:16px; margin-bottom:12px; }
  .modal h3 { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); margin-top:14px; margin-bottom:8px; }
  .modal .kbd-row { display:flex; justify-content:space-between; padding:5px 0; font-size:12px; color:var(--text-dim); border-bottom:1px dashed var(--border); }
  .modal kbd { background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:2px 6px; font-family:'Cascadia Code','Fira Code',monospace; font-size:11px; color:var(--text); }
  .modal pre { background:var(--bg); border:1px solid var(--border); border-radius:7px; padding:12px; overflow:auto; max-height:320px; font-size:11px; font-family:'Cascadia Code','Fira Code',monospace; color:var(--text); }
  .modal-close-row { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
  .modal button.primary { background:var(--accent); border:none; color:#fff; padding:7px 14px; border-radius:7px; cursor:pointer; font-size:12px; font-family:inherit; }
  .modal button.primary:hover { filter:brightness(1.1); }
  .modal button.secondary { background:var(--bg); border:1px solid var(--border); color:var(--text); padding:7px 14px; border-radius:7px; cursor:pointer; font-size:12px; font-family:inherit; }

  /* Toast */
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(24px); background:var(--surface); border:1px solid var(--accent); border-radius:7px; padding:10px 16px; font-size:12px; color:var(--text); z-index:300; opacity:0; transition:all .25s cubic-bezier(.4,0,.2,1); box-shadow:var(--shadow); pointer-events:none; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* Misc */
  .breadcrumb { display:flex; align-items:center; gap:7px; margin-bottom:14px; font-size:12px; color:var(--text-dim); }
  .no-results { text-align:center; padding:46px 22px; color:var(--text-dim); }
  .no-results-icon { font-size:40px; margin-bottom:12px; opacity:.3; }
  .empty { color:var(--text-dim); font-size:12px; padding:14px; font-style:italic; }

  ::-webkit-scrollbar { width:5px; height:5px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
  ::-webkit-scrollbar-thumb:hover { background:var(--text-dim); }

  @media (max-width:860px) {
    .sidebar { display:none; }
    .detail-panel { width:100%; }
    .project-cards { grid-template-columns:1fr; }
    .search-box input { width:160px; }
    .header h1 span { display:none; }
  }

  @media print {
    .header, .sidebar, .detail-panel, .filter-bar, .zoom-controls, .header-actions, .toast, .modal-backdrop { display:none !important; }
    .app { height:auto; }
    .main { overflow:visible; }
    body { background:#fff; color:#000; }
    .project-card, .flow-item, .arch-summary, .endpoint-table { page-break-inside:avoid; break-inside:avoid; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">◈</div>
  <h1 id="appTitle">Project<span>Architecture Map</span></h1>
  <div class="view-toggle">
    <button class="active" data-view="architecture" onclick="switchView('architecture')">Architecture</button>
    <button data-view="diagram"   onclick="switchView('diagram')">Infra Diagram</button>
    <button data-view="graph"     onclick="switchView('graph')">Graph</button>
    <button data-view="flows"     onclick="switchView('flows')">Data Flows</button>
    <button data-view="endpoints" onclick="switchView('endpoints')">Endpoints</button>
  </div>
  <div class="header-actions">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search files, classes, methods…" oninput="handleSearch(this.value)">
    </div>
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle light/dark theme">☾</button>
    <button class="icon-btn" onclick="openExportMenu()" title="Export diagram or data">⇩</button>
    <button class="icon-btn" onclick="openHelpModal()" title="Keyboard shortcuts (?)">?</button>
  </div>
</div>

<div class="stats-bar" id="statsBar"></div>
<div class="filter-bar" id="filterBar"></div>

<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="mainContent"></div>
</div>

<div class="detail-panel" id="detailPanel">
  <div class="detail-header">
    <button class="detail-close" onclick="closeDetail()">✕</button>
    <div>
      <div id="detailTitle" style="font-size:15px;font-weight:600;"></div>
      <div id="detailSubtitle" style="font-size:11px;color:var(--text-dim);margin-top:2px;"></div>
    </div>
  </div>
  <div class="detail-content" id="detailContent"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const DATA = {{DATA_JSON}};

// ── State ─────────────────────────────────────────────────────────────────────
const STATE = {
  view: 'architecture',
  selectedProject: null,
  connectionFilter: new Set(),           // empty = all visible
  highlightProject: null,                // clicked-to-highlight id
  theme: 'dark',
};
const EDGE_COLORS = { http:'#10b981', di:'#8b5cf6', reference:'#6b7280', amqp:'#f97316', grpc:'#06b6d4', file:'#f59e0b', websocket:'#ec4899', graphql:'#ec4899', trpc:'#14b8a6', sse:'#a855f7', 'shared-db':'#64748b', env:'#94a3b8', webhook:'#fb7185' };
const EDGE_DASH   = { http:'6 3', di:'', reference:'3 3', amqp:'8 4', grpc:'4 2', file:'5 3', websocket:'2 2', graphql:'6 3', trpc:'6 3', sse:'4 4', 'shared-db':'2 6', env:'1 4', webhook:'6 2' };

// ── Utilities ─────────────────────────────────────────────────────────────────
const ESC_MAP = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
function esc(s) { return s == null ? '' : String(s).replace(/[&<>"']/g, c => ESC_MAP[c]); }
function escAttr(s) { return esc(s); }
function clsName(s) { return String(s||'').replace(/[^A-Za-z0-9_-]/g, ''); }
// Safe for embedding inside a single-quoted JS string inside an HTML attribute.
// HTML entity decoding happens before JS parsing, so we must neutralise quotes,
// backslashes, angle brackets, and ampersands in one pass.
function jsStr(s) {
  return String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/"/g, '\\"')
    .replace(/\r?\n/g, '\\n')
    .replace(/</g, '\\x3C')
    .replace(/>/g, '\\x3E')
    .replace(/&/g, '\\x26');
}

function findProject(idOrName) {
  if (!idOrName) return null;
  return DATA.projects.find(p => p.id === idOrName || p.name === idOrName) || null;
}
function findInfra(id) {
  return (DATA.infraComponents||[]).find(i => i.id === id) || null;
}

function toast(msg, ms) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => t.classList.remove('show'), ms || 2000);
}

function copyToClipboard(text) {
  if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard'));
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('Copied to clipboard'); } finally { document.body.removeChild(ta); }
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────
function init() {
  document.getElementById('appTitle').innerHTML =
    esc(DATA.meta.project) + '<span>Architecture Map</span>';
  document.title = DATA.meta.project + ' — Architecture Map';
  applyTheme(loadTheme());
  restoreFromHash();
  renderStats();
  renderSidebar();
  renderFilterBar();
  renderCurrentView();
  window.addEventListener('hashchange', () => restoreFromHash(true));
}

// ── Theme ─────────────────────────────────────────────────────────────────────
function loadTheme() {
  try { return localStorage.getItem('arcmap-theme') || 'dark'; } catch { return 'dark'; }
}
function applyTheme(t) {
  STATE.theme = (t === 'light') ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', STATE.theme);
  document.getElementById('themeBtn').textContent = STATE.theme === 'dark' ? '☾' : '☀';
  try { localStorage.setItem('arcmap-theme', STATE.theme); } catch {}
}
function toggleTheme() {
  applyTheme(STATE.theme === 'dark' ? 'light' : 'dark');
  renderCurrentView();
}

// ── URL state / deep-linking ──────────────────────────────────────────────────
function updateHash() {
  const params = new URLSearchParams();
  params.set('view', STATE.view);
  if (STATE.selectedProject) params.set('project', STATE.selectedProject);
  if (STATE.connectionFilter.size) params.set('filter', [...STATE.connectionFilter].join(','));
  const hash = '#' + params.toString();
  if (location.hash !== hash) history.replaceState(null, '', hash);
}
function restoreFromHash(rerender) {
  const params = new URLSearchParams(location.hash.replace(/^#/, ''));
  const view = params.get('view');
  if (view && view !== STATE.view) STATE.view = view;
  const proj = params.get('project');
  if (proj) STATE.selectedProject = proj;
  const filter = params.get('filter');
  STATE.connectionFilter = new Set(filter ? filter.split(',').filter(Boolean) : []);
  if (rerender) { renderCurrentView(); renderSidebar(); renderFilterBar(); }
  if (proj) setTimeout(() => openProjectDetail(proj, true), 30);
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function renderStats() {
  const totalFiles   = DATA.projects.reduce((s,p) => s + (p.files?.length||0), 0);
  const totalClasses = DATA.projects.reduce((s,p) => s + (p.files||[]).reduce((fs,f) => fs + (f.classes?.length||0), 0), 0);
  const infraCount   = (DATA.infraComponents||[]).length;
  const endpointCount = collectEndpoints().length;
  document.getElementById('statsBar').innerHTML = [
    `<div class="stat"><span class="stat-value">${DATA.projects.length}</span> Projects</div>`,
    `<div class="stat"><span class="stat-value">${totalFiles}</span> Files</div>`,
    `<div class="stat"><span class="stat-value">${totalClasses}</span> Classes</div>`,
    `<div class="stat"><span class="stat-value">${DATA.connections.length}</span> Connections</div>`,
    `<div class="stat"><span class="stat-value">${(DATA.architecture.dataFlows||[]).length}</span> Data Flows</div>`,
    infraCount ? `<div class="stat"><span class="stat-value">${infraCount}</span> Infra</div>` : '',
    endpointCount ? `<div class="stat"><span class="stat-value">${endpointCount}</span> Endpoints</div>` : '',
  ].join('');
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
function renderSidebar() {
  let html = '<div class="sidebar-section"><h3>Projects</h3>';
  DATA.projects.forEach(p => {
    const active = STATE.selectedProject === p.id ? 'active' : '';
    html += `<div class="proj-item ${active}" onclick="selectProject('${jsStr(p.id)}')">
      <div class="proj-dot" style="background:${escAttr(p.color)}"></div>
      <div class="proj-name" title="${escAttr(p.name)}">${esc(p.shortName)}</div>
      <div class="proj-type">${esc(p.type)}</div>
    </div>`;
  });
  html += '</div><div class="sidebar-section"><h3>Connections</h3>';
  DATA.connections.forEach((c, i) => {
    const from = findProject(c.from), to = findProject(c.to) || findInfra(c.to);
    if (!from || !to) return;
    const toColor = to.color || '#6b7280';
    html += `<div class="proj-item" onclick="showConnectionDetail(${i})">
      <div class="proj-dot" style="background:${escAttr(from.color)}"></div>
      <div class="proj-name" style="font-size:10px">${esc(from.shortName)} → ${esc(to.shortName || to.label)}</div>
      <div class="proj-type">${esc(c.type)}</div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('sidebar').innerHTML = html;
}

// ── Filter bar ────────────────────────────────────────────────────────────────
function renderFilterBar() {
  const bar = document.getElementById('filterBar');
  const visible = STATE.view === 'graph' || STATE.view === 'diagram';
  bar.classList.toggle('visible', visible);
  if (!visible) return;
  const types = [...new Set(DATA.connections.map(c => c.type))].sort();
  let html = `<span style="font-weight:600;margin-right:4px;">Filter:</span>`;
  types.forEach(t => {
    const off = STATE.connectionFilter.has(t);
    const col = EDGE_COLORS[t] || '#6b7280';
    html += `<span class="filter-chip ${off?'off':''}" onclick="toggleFilter('${jsStr(t)}')">
      <span class="filter-swatch" style="background:${escAttr(col)}"></span>${esc(t)}
    </span>`;
  });
  if (STATE.connectionFilter.size) {
    html += `<button class="icon-btn" style="width:auto;padding:3px 10px;font-size:10px;margin-left:6px;" onclick="clearFilter()">Reset</button>`;
  }
  bar.innerHTML = html;
}
function toggleFilter(t) {
  if (STATE.connectionFilter.has(t)) STATE.connectionFilter.delete(t);
  else STATE.connectionFilter.add(t);
  renderFilterBar(); renderCurrentView(); updateHash();
}
function clearFilter() { STATE.connectionFilter.clear(); renderFilterBar(); renderCurrentView(); updateHash(); }
function isConnVisible(c) { return !STATE.connectionFilter.has(c.type); }

// ── View switch ───────────────────────────────────────────────────────────────
function switchView(view) {
  STATE.view = view;
  STATE.highlightProject = null;
  document.querySelectorAll('.view-toggle button').forEach(b =>
    b.classList.toggle('active', b.dataset.view === view));
  renderFilterBar();
  renderCurrentView();
  closeDetail();
  updateHash();
}
function renderCurrentView() {
  const v = STATE.view;
  if (v === 'architecture')    renderArchitecture();
  else if (v === 'diagram')    renderInfraDiagram();
  else if (v === 'graph')      renderGraph();
  else if (v === 'flows')      renderFlows();
  else if (v === 'endpoints')  renderEndpoints();
}

// ── Architecture view ─────────────────────────────────────────────────────────
function renderArchitecture() {
  const layerColors = ['#06b6d4','#10b981','#f59e0b','#ef4444','#8b5cf6','#f97316'];
  let html = `<div class="arch-summary"><strong>System Overview:</strong> ${esc(DATA.architecture.summary)}</div>`;
  (DATA.architecture.layers||[]).forEach((layer, i) => {
    html += `<div class="layer-section">
      <div class="layer-label"><div class="layer-dot" style="background:${layerColors[i%layerColors.length]}"></div>${esc(layer.name)}</div>
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:12px;margin-left:4px">${esc(layer.description)}</div>
      <div class="project-cards">`;
    (layer.projects||[]).forEach(pid => {
      const p = findProject(pid);
      if (p) html += renderProjectCard(p);
    });
    html += '</div></div>';
  });
  document.getElementById('mainContent').innerHTML = html;
}

function renderProjectCard(p) {
  const icons = {cube:'◆',cog:'⚙',server:'▣',refresh:'⟳',database:'◉',globe:'◎',clock:'⏲',mobile:'📱',desktop:'🖥',browser:'🌐'};
  const sub = [p.technology, p.port ? ':'+p.port : '', p.database].filter(Boolean).map(esc).join(' · ');
  const tags = (p.keyPatterns||[]).slice(0,3).map(t => `<span class="card-tag">${esc(t)}</span>`).join('');
  const fileTag = p.files?.length ? `<span class="card-tag">${p.files.length} files</span>` : '';
  return `<div class="project-card" style="--card-color:${escAttr(p.color)}" onclick="openProjectDetail('${jsStr(p.id)}')">
    <div class="card-header">
      <div class="card-icon" style="background:${escAttr(p.color)}20;color:${escAttr(p.color)}">${esc(icons[p.icon]||'◆')}</div>
      <div>
        <div class="card-title">${esc(p.name)}</div>
        <div class="card-subtitle">${sub}</div>
      </div>
    </div>
    <div class="card-desc">${esc(p.description)}</div>
    <div class="card-tags">${fileTag}${tags}</div>
  </div>`;
}

// ── Layer layout helper (used by diagram + graph) ─────────────────────────────
function computeLayout(W, H, includeInfra) {
  const layerMap = {};
  (DATA.architecture.layers||[]).forEach((l,i) => (l.projects||[]).forEach(pid => {
    const p = findProject(pid); if (p) layerMap[p.id] = i;
  }));
  DATA.projects.forEach(p => { if (layerMap[p.id] == null) layerMap[p.id] = (DATA.architecture.layers||[]).length; });
  const layerCount = Math.max(...Object.values(layerMap), 0) + 1;
  const infraCount = includeInfra ? (DATA.infraComponents||[]).length : 0;
  const rowCount = layerCount + (infraCount ? 1 : 0);
  const rowH = (H - 100) / (rowCount + 1);
  const layerNodes = {};
  DATA.projects.forEach(p => {
    const l = layerMap[p.id];
    (layerNodes[l] || (layerNodes[l] = [])).push(p);
  });
  const positions = {};
  Object.entries(layerNodes).forEach(([layer, nodes]) => {
    const y = (parseInt(layer)+1) * rowH + 50;
    const step = W / (nodes.length + 1);
    nodes.forEach((p,i) => positions[p.id] = { x:(i+1)*step, y });
  });
  const infraPositions = {};
  if (includeInfra && infraCount) {
    const infraY = (layerCount+1) * rowH + 50;
    (DATA.infraComponents||[]).forEach((ic,i) => {
      infraPositions[ic.id] = { x:(i+1)*(W/(infraCount+1)), y: infraY };
    });
  }
  return { positions, infraPositions, layerMap, layerNodes, rowH, layerCount };
}

// ── Infra Diagram ─────────────────────────────────────────────────────────────
function renderInfraDiagram() {
  const W = 1200, H = 860;
  const { positions, infraPositions, layerNodes, rowH, layerCount } = computeLayout(W, H, true);
  const defs = `<defs>
    <marker id="af" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4b5563"/>
    </marker>
  </defs>`;

  const nodeW = 140, nodeH = 54;
  const layerColors = ['#06b6d4','#10b981','#f59e0b','#ef4444','#8b5cf6','#f97316'];

  // Zones
  let zones = '';
  (DATA.architecture.layers||[]).forEach((l,i) => {
    const nodes = layerNodes[i] || [];
    if (!nodes.length) return;
    const xs = nodes.map(p => positions[p.id].x);
    const ys = nodes.map(p => positions[p.id].y);
    const minX = Math.min(...xs) - nodeW/2 - 16;
    const maxX = Math.max(...xs) + nodeW/2 + 16;
    const minY = Math.min(...ys) - nodeH/2 - 18;
    const maxY = Math.max(...ys) + nodeH/2 + 12;
    const col = layerColors[i % layerColors.length];
    zones += `<rect class="infra-zone" x="${minX}" y="${minY}" width="${maxX-minX}" height="${maxY-minY}" rx="12" fill="${col}0d" stroke="${col}33"/>
      <text class="infra-zone-label" x="${minX+12}" y="${minY+16}" fill="${col}99">${esc(l.name.toUpperCase())}</text>`;
  });
  const infraComponents = DATA.infraComponents || [];
  if (infraComponents.length) {
    const xs = infraComponents.map(ic => infraPositions[ic.id].x);
    const infraY = (layerCount+1) * rowH + 50;
    const minX = Math.min(...xs) - 64;
    const maxX = Math.max(...xs) + 64;
    zones += `<rect class="infra-zone" x="${minX}" y="${infraY-36}" width="${maxX-minX}" height="84" rx="12" fill="#f973160d" stroke="#f9731633"/>
      <text class="infra-zone-label" x="${minX+12}" y="${infraY-20}" fill="#f9731699">INFRASTRUCTURE</text>`;
  }

  // Edges
  let edges = '';
  DATA.connections.forEach(c => {
    if (!isConnVisible(c)) return;
    const from = positions[c.from] || infraPositions[c.from];
    const to   = positions[c.to]   || infraPositions[c.to];
    if (!from || !to) return;
    const mx = (from.x + to.x) / 2, my = (from.y + to.y) / 2 - 12;
    const col = EDGE_COLORS[c.type] || '#4b5563';
    const dash = EDGE_DASH[c.type] ? `stroke-dasharray="${EDGE_DASH[c.type]}"` : '';
    const dim = STATE.highlightProject && c.from !== STATE.highlightProject && c.to !== STATE.highlightProject ? 'dim' : '';
    const label = c.label || c.type;
    const labelW = Math.max(28, label.length * 5);
    edges += `<path class="iedge ${dim}" d="M${from.x},${from.y} Q${mx},${my} ${to.x},${to.y}" stroke="${col}" ${dash} marker-end="url(#af)"/>
      <rect x="${mx-labelW/2}" y="${my-9}" width="${labelW}" height="13" rx="3" fill="var(--edge-label-bg)" opacity=".85" class="${dim}"/>
      <text class="iedge-label ${dim}" x="${mx}" y="${my-2}" fill="${col}">${esc(label)}</text>`;
  });

  // Project nodes
  let nodes = '';
  DATA.projects.forEach(p => {
    const pos = positions[p.id]; if (!pos) return;
    const dim = STATE.highlightProject && STATE.highlightProject !== p.id && !isConnected(STATE.highlightProject, p.id) ? 'dim' : '';
    nodes += `<g class="inode graph-node ${dim}" onclick="toggleHighlight('${jsStr(p.id)}')" ondblclick="openProjectDetail('${jsStr(p.id)}')" transform="translate(${pos.x},${pos.y})">
      <rect class="inode-box" width="${nodeW}" height="${nodeH}" x="-${nodeW/2}" y="-${nodeH/2}" fill="${escAttr(p.color)}22" stroke="${escAttr(p.color)}"/>
      <text class="inode-title" y="-8">${esc(p.shortName)}</text>
      <text class="inode-sub" y="8">${esc(p.technology||p.type)}</text>
      ${p.port ? `<rect rx="3" x="${nodeW/2-34}" y="${-nodeH/2+3}" width="32" height="13" fill="${escAttr(p.color)}33" stroke="${escAttr(p.color)}"/>
        <text style="font-size:8px;font-weight:700;dominant-baseline:middle;text-anchor:middle" x="${nodeW/2-18}" y="${-nodeH/2+10}" fill="${escAttr(p.color)}">:${esc(p.port)}</text>`:''}
    </g>`;
  });
  infraComponents.forEach(ic => {
    const pos = infraPositions[ic.id]; if (!pos) return;
    const col = ic.color || '#f97316';
    nodes += `<g class="inode graph-node" onclick="openInfraDetail('${jsStr(ic.id)}')" transform="translate(${pos.x},${pos.y})">
      <rect class="inode-box" width="120" height="54" x="-60" y="-27" fill="${escAttr(col)}22" stroke="${escAttr(col)}"/>
      <text class="inode-icon" y="-9">${esc(ic.icon||'⚙')}</text>
      <text class="inode-title" y="8">${esc(ic.label)}</text>
      <text class="inode-sub" y="20">${esc(ic.subtitle||ic.category||'')}</text>
    </g>`;
  });

  const svg = `<svg id="infraSvg" width="100%" height="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    ${defs}${zones}${edges}${nodes}
  </svg>`;

  document.getElementById('mainContent').innerHTML = `<div class="svg-viewport" id="infraViewport">
    ${svg}
    <div class="zoom-controls">
      <button class="zoom-btn" onclick="zoomSvg('infraSvg',0.8)" title="Zoom in">+</button>
      <button class="zoom-btn" onclick="zoomSvg('infraSvg',1.25)" title="Zoom out">−</button>
      <button class="zoom-btn" onclick="resetZoom('infraSvg',${W},${H})" title="Reset view">⌂</button>
    </div>

function renderGraph() {
  const W = 1200, H = 760;
  const { positions } = computeLayout(W, H, false);
  let edges = '';
  DATA.connections.forEach(c => {
    if (!isConnVisible(c)) return;
    const from = positions[c.from], to = positions[c.to];
    if (!from || !to) return;
    const mx = (from.x + to.x) / 2, my = (from.y + to.y) / 2 - 14;
    const col = EDGE_COLORS[c.type] || '#6b7280';
    const dash = EDGE_DASH[c.type] ? `stroke-dasharray="${EDGE_DASH[c.type]}"` : '';
    const highlight = STATE.highlightProject && (c.from === STATE.highlightProject || c.to === STATE.highlightProject) ? 'highlight' : '';
    const dim = STATE.highlightProject && c.from !== STATE.highlightProject && c.to !== STATE.highlightProject ? 'dim' : '';
    const labelDim = dim || '';
    edges += `<path class="graph-edge ${highlight} ${dim}" d="M${from.x},${from.y} Q${mx},${my} ${to.x},${to.y}" stroke="${col}" ${dash} marker-end="url(#garrow)"/>
      <text class="graph-edge-label ${labelDim}" x="${mx}" y="${my-5}">${esc(c.label||c.type)}</text>`;
  });
  let nodes = '';
  DATA.projects.forEach(p => {
    const pos = positions[p.id]; if (!pos) return;
    const words = (p.shortName || p.name || p.id).split(' ');
    const dim = STATE.highlightProject && STATE.highlightProject !== p.id && !isConnected(STATE.highlightProject, p.id) ? 'dim' : '';
    nodes += `<g class="graph-node ${dim}" onclick="toggleHighlight('${jsStr(p.id)}')" ondblclick="openProjectDetail('${jsStr(p.id)}')" transform="translate(${pos.x},${pos.y})">
      <circle r="34" fill="${escAttr(p.color)}22" stroke="${escAttr(p.color)}" stroke-width="2"/>
      <text dy="-4" style="font-size:9px">${esc(words[0])}</text>
      <text dy="9" style="font-size:8px;fill:var(--text-dim)">${esc(words.slice(1).join(' '))}</text>
    </g>`;
  });
  document.getElementById('mainContent').innerHTML = `<div class="svg-viewport" id="graphViewport">
    <svg id="graphSvg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      <defs><marker id="garrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
      </marker></defs>
      ${edges}${nodes}
    </svg>
    <div class="zoom-controls">
      <button class="zoom-btn" onclick="zoomSvg('graphSvg',0.8)" title="Zoom in">+</button>
      <button class="zoom-btn" onclick="zoomSvg('graphSvg',1.25)" title="Zoom out">−</button>
      <button class="zoom-btn" onclick="resetZoom('graphSvg',${W},${H})" title="Reset view">⌂</button>
    </div>
    <div class="graph-overlay">${connectionLegend()}<div style="margin-top:6px;font-size:9px;opacity:.7;">Click node to highlight · Double-click to open</div></div>
  </div>`;
  bindPanZoom('graphSvg', W, H);
}

function connectionLegend() {
  const types = [...new Set(DATA.connections.map(c => c.type))].sort();
  return types.map(t => {
    const col = EDGE_COLORS[t] || '#6b7280';
    const dash = EDGE_DASH[t] ? 'dashed' : 'solid';
    const bg = dash === 'dashed'
      ? `repeating-linear-gradient(90deg,${col} 0,${col} 6px,transparent 6px,transparent 10px)`
      : col;
    return `<div class="legend-item"><div class="legend-line" style="background:${bg}"></div>${esc(t)}</div>`;
  }).join('');
}

function isConnected(a, b) {
  return DATA.connections.some(c => (c.from === a && c.to === b) || (c.from === b && c.to === a));
}

// ── Pan/Zoom ──────────────────────────────────────────────────────────────────
const VIEWBOXES = {};
function bindPanZoom(svgId, W, H) {
  const svg = document.getElementById(svgId); if (!svg) return;
  VIEWBOXES[svgId] = [0, 0, W, H];
  svg.setAttribute('viewBox', VIEWBOXES[svgId].join(' '));
  let dragging = false, startX = 0, startY = 0, startVB = null;
  svg.addEventListener('mousedown', e => {
    if (e.target.closest('.graph-node, .inode')) return;
    dragging = true; startX = e.clientX; startY = e.clientY;
    startVB = [...VIEWBOXES[svgId]]; svg.classList.add('grabbing');
  });
  window.addEventListener('mouseup', () => { dragging = false; svg.classList.remove('grabbing'); });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const rect = svg.getBoundingClientRect();
    const sx = startVB[2] / rect.width, sy = startVB[3] / rect.height;
    VIEWBOXES[svgId][0] = startVB[0] - (e.clientX - startX) * sx;
    VIEWBOXES[svgId][1] = startVB[1] - (e.clientY - startY) * sy;
    svg.setAttribute('viewBox', VIEWBOXES[svgId].join(' '));
  });
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY > 0 ? 1.1 : 0.9;
    const rect = svg.getBoundingClientRect();
    const vb = VIEWBOXES[svgId];
    const px = vb[0] + (e.clientX - rect.left) / rect.width  * vb[2];
    const py = vb[1] + (e.clientY - rect.top)  / rect.height * vb[3];
    vb[0] = px - (px - vb[0]) * factor;
    vb[1] = py - (py - vb[1]) * factor;
    vb[2] *= factor; vb[3] *= factor;
    svg.setAttribute('viewBox', vb.join(' '));
  }, { passive: false });
}
function zoomSvg(svgId, factor) {
  const vb = VIEWBOXES[svgId]; if (!vb) return;
  const cx = vb[0] + vb[2]/2, cy = vb[1] + vb[3]/2;
  vb[0] = cx - (cx - vb[0]) * factor; vb[1] = cy - (cy - vb[1]) * factor;
  vb[2] *= factor; vb[3] *= factor;
  document.getElementById(svgId).setAttribute('viewBox', vb.join(' '));
}
function resetZoom(svgId, W, H) {
  VIEWBOXES[svgId] = [0, 0, W, H];
  document.getElementById(svgId).setAttribute('viewBox', VIEWBOXES[svgId].join(' '));
}

// ── Endpoints view ────────────────────────────────────────────────────────────
function collectEndpoints() {
  const endpoints = [];
  const reVerb = /^(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)\s+(.+)$/i;
  const verbInMethod = /\b(Get|Post|Put|Patch|Delete)\b/;
  DATA.projects.forEach(p => {
    (p.files || []).forEach(f => {
      if (f.category !== 'Endpoint') return;
      // Prefer explicit endpoints array (new optional schema field)
      if (Array.isArray(f.endpoints) && f.endpoints.length) {
        f.endpoints.forEach(ep => endpoints.push({
          method: (ep.method || 'ANY').toUpperCase(),
          path: ep.path || '',
          description: ep.description || '',
          project: p, file: f,
        }));
        return;
      }
      // Otherwise derive from methods: look for "GET /api/..." patterns in signatures/names
      (f.methods || []).forEach(m => {
        let method = 'ANY', path = '';
        const sig = m.signature || m.name || '';
        const sm = (m.name || '').match(reVerb) || sig.match(reVerb);
        if (sm) { method = sm[1].toUpperCase(); path = sm[2].trim(); }
        else {
          const vm = (m.name || '').match(verbInMethod);
          if (vm) method = vm[1].toUpperCase();
          path = m.name || '';
        }
        endpoints.push({ method, path, description: m.description||'', project: p, file: f });
      });
      // Fallback: derive from path if no methods
      if (!(f.methods || []).length) {
        endpoints.push({ method:'ANY', path: f.path.split('/').pop(), description: f.description||'', project: p, file: f });
      }
    });
  });
  return endpoints;
}

function renderEndpoints() {
  const all = collectEndpoints();
  if (!all.length) {
    document.getElementById('mainContent').innerHTML = `<div class="empty">No endpoints detected. Mark files with <code>category: "Endpoint"</code> or include an <code>endpoints</code> array per file.</div>`;
    return;
  }
  const html = `
    <div class="endpoint-toolbar">
      <h2 style="font-size:17px;margin-right:auto">API Endpoints (${all.length})</h2>
      <input type="text" id="endpointFilter" placeholder="Filter endpoints…" oninput="filterEndpoints(this.value)">
    </div>
    <div id="endpointTableWrap">${renderEndpointTable(all)}</div>`;
  document.getElementById('mainContent').innerHTML = html;
}
function renderEndpointTable(rows) {
  if (!rows.length) return `<div class="empty">No endpoints match that filter.</div>`;
  let html = `<table class="endpoint-table"><thead><tr>
    <th style="width:80px">Method</th><th>Path</th><th style="width:140px">Project</th><th>Description</th>
  </tr></thead><tbody>`;
  rows.forEach(ep => {
    html += `<tr onclick="openProjectDetail('${jsStr(ep.project.id)}')" style="cursor:pointer">
      <td><span class="method-pill ${clsName(ep.method)}">${esc(ep.method)}</span></td>
      <td class="endpoint-path">${esc(ep.path)}</td>
      <td><span style="color:${escAttr(ep.project.color)};font-weight:600">${esc(ep.project.shortName)}</span></td>
      <td>${esc(ep.description)}</td>
    </tr>`;
  });
  return html + '</tbody></table>';
}
function filterEndpoints(q) {
  const all = collectEndpoints();
  const qs = (q||'').toLowerCase().trim();
  const rows = !qs ? all : all.filter(ep =>
    ep.path.toLowerCase().includes(qs) ||
    ep.method.toLowerCase().includes(qs) ||
    ep.description.toLowerCase().includes(qs) ||
    ep.project.shortName.toLowerCase().includes(qs));
  document.getElementById('endpointTableWrap').innerHTML = renderEndpointTable(rows);
}

// ── Search ────────────────────────────────────────────────────────────────────
function handleSearch(query) {
  if (!query || query.length < 2) { renderCurrentView(); return; }
  const q = query.toLowerCase(), results = [];
  DATA.projects.forEach(p => {
    (p.files||[]).forEach(f => {
      let score = 0;
      if ((f.path||'').toLowerCase().includes(q))         score += 10;
      if ((f.description||'').toLowerCase().includes(q))  score += 5;
      (f.classes||[]).forEach(c => {
        if (c.name.toLowerCase().includes(q))             score += 8;
        if ((c.description||'').toLowerCase().includes(q)) score += 3;
      });
      (f.methods||[]).forEach(m => {
        if (m.name.toLowerCase().includes(q))             score += 8;
        if ((m.signature||'').toLowerCase().includes(q))  score += 4;
        if ((m.description||'').toLowerCase().includes(q)) score += 2;
      });
      if (score > 0) results.push({ project:p, file:f, score });
    });
  });
  results.sort((a,b) => b.score - a.score);
  const main = document.getElementById('mainContent');
  if (!results.length) { main.innerHTML = `<div class="no-results"><div class="no-results-icon">🔍</div><div>No results for "${esc(query)}"</div></div>`; return; }
  let html = `<div class="breadcrumb"><span>Search: "${esc(query)}" — ${results.length} result${results.length!==1?'s':''}</span></div>`;
  results.slice(0, 40).forEach((r,i) => {
    html += `<div style="margin-bottom:7px">
      <div style="font-size:10px;color:${escAttr(r.project.color)};font-weight:600;margin-bottom:3px;cursor:pointer" onclick="openProjectDetail('${jsStr(r.project.id)}')">${esc(r.project.shortName)}</div>
      ${renderFileItem(r.file, 's'+i)}
    </div>`;
  });
  main.innerHTML = html;
}

    </div>
    <h3>Share this view</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="secondary" onclick="copyToClipboard(location.href)">Copy URL</button>
    </div>
    <div class="modal-close-row"><button class="secondary" onclick="closeModal()">Close</button></div>`;
  openModal();
}

function currentSvg() {
  const svg = document.querySelector('.svg-viewport svg');
  return svg;
}
function exportSvg() {
  const svg = currentSvg();
  if (!svg) { toast('Switch to Graph or Infra Diagram to export'); return; }
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  const styles = document.querySelector('style').textContent;
  const styleEl = document.createElementNS('http://www.w3.org/2000/svg', 'style');
  styleEl.textContent = styles;
  clone.insertBefore(styleEl, clone.firstChild);
  const xml = new XMLSerializer().serializeToString(clone);
  const blob = new Blob([xml], { type: 'image/svg+xml' });
  downloadBlob(blob, `${DATA.meta.project}-${STATE.view}.svg`);
}
function exportPng() {
  const svg = currentSvg();
  if (!svg) { toast('Switch to Graph or Infra Diagram to export'); return; }
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  const styles = document.querySelector('style').textContent;
  const styleEl = document.createElementNS('http://www.w3.org/2000/svg', 'style');
  styleEl.textContent = styles;
  clone.insertBefore(styleEl, clone.firstChild);
  const xml = new XMLSerializer().serializeToString(clone);
  const vb = (svg.getAttribute('viewBox')||'0 0 1200 800').split(' ').map(Number);
  const W = vb[2]*2, H = vb[3]*2;
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = getComputedStyle(document.body).backgroundColor;
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(img, 0, 0, W, H);
    canvas.toBlob(b => downloadBlob(b, `${DATA.meta.project}-${STATE.view}.png`));
  };
  img.onerror = () => toast('PNG export failed');
  img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(xml)));
}
function exportJson() {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  downloadBlob(blob, `${DATA.meta.project}-arcmap.json`);
}
function exportMermaid() {
  const lines = ['graph LR'];
  DATA.projects.forEach(p => {
    lines.push(`  ${mmid(p.id)}["${p.shortName.replace(/"/g,"'")}\\n<${p.type}>"]`);
  });
  (DATA.infraComponents||[]).forEach(ic => {
    lines.push(`  ${mmid(ic.id)}(("${ic.label.replace(/"/g,"'")}"))`);
  });
  DATA.connections.forEach(c => {
    const arrow = c.type === 'reference' ? '-.->' : c.type === 'amqp' ? '==>' : '-->';
    const label = c.label || c.type;
    lines.push(`  ${mmid(c.from)} ${arrow}|${label.replace(/\|/g,'/')}| ${mmid(c.to)}`);
  });
  const out = lines.join('\n');
  const body = document.getElementById('modalBody');
  body.innerHTML = `<h2>Mermaid export</h2>
    <p style="font-size:12px;color:var(--text-dim);margin-bottom:10px">Paste into any Mermaid-capable renderer (GitHub README, Notion, Obsidian, mermaid.live).</p>
    <pre id="mermaidPre">${esc(out)}</pre>
    <div class="modal-close-row">
      <button class="primary" id="mermaidCopyBtn">Copy</button>
      <button class="secondary" onclick="closeModal()">Close</button>
    </div>`;
  document.getElementById('mermaidCopyBtn').onclick = () => copyToClipboard(out);
  openModal();
}
function mmid(s) { return String(s||'').replace(/[^A-Za-z0-9]/g,'_') || 'n'; }

function exportMarkdown() {
  const lines = [`# ${DATA.meta.project} — Architecture Map`, ''];
  lines.push(`> Generated ${DATA.meta.generated || ''}`);
  lines.push('');
  lines.push(`## Overview`, '', DATA.architecture.summary || '', '');
  lines.push(`## Projects`, '');
  DATA.projects.forEach(p => {
    lines.push(`### ${p.name} (${p.type})`);
    if (p.technology) lines.push(`- **Tech:** ${p.technology}`);
    if (p.port)       lines.push(`- **Port:** ${p.port}`);
    if (p.database)   lines.push(`- **Database:** ${p.database}`);
    if (p.keyPatterns?.length) lines.push(`- **Patterns:** ${p.keyPatterns.join(', ')}`);
    lines.push('', p.description || '', '');
  });
  if (DATA.connections.length) {
    lines.push(`## Connections`, '', '| From | To | Type | Description |', '|---|---|---|---|');
    DATA.connections.forEach(c => {
      const from = findProject(c.from)?.shortName || c.from;
      const to   = findProject(c.to)?.shortName   || findInfra(c.to)?.label || c.to;
      lines.push(`| ${from} | ${to} | ${c.type} | ${(c.description||'').replace(/\|/g,'/')} |`);
    });
    lines.push('');
  }
  const out = lines.join('\n');
  const blob = new Blob([out], { type: 'text/markdown' });
  downloadBlob(blob, `${DATA.meta.project}-arcmap.md`);
}
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}

function copyProjectLink(id) {
  const u = new URL(location.href);
  u.hash = `view=${STATE.view}&project=${encodeURIComponent(id)}`;
  copyToClipboard(u.toString());
}
function copyProjectMarkdown(id) {
  const p = findProject(id); if (!p) return;
  const lines = [`### ${p.name}`, ''];
  if (p.technology) lines.push(`- **Tech:** ${p.technology}`);
  if (p.port)       lines.push(`- **Port:** ${p.port}`);
  if (p.database)   lines.push(`- **Database:** ${p.database}`);
  if (p.keyPatterns?.length) lines.push(`- **Patterns:** ${p.keyPatterns.join(', ')}`);
  lines.push('', p.description || '', '');
  const conns = DATA.connections.filter(c => c.from === id || c.to === id);
  if (conns.length) {
    lines.push('**Connections:**');
    conns.forEach(c => {
      const otherId = c.from === id ? c.to : c.from;
      const other = findProject(otherId) || findInfra(otherId);
      const name = other?.shortName || other?.label || otherId;
      const dir = c.from === id ? '→' : '←';
      lines.push(`- ${dir} ${name} (${c.type}) — ${c.description||''}`);
    });
  }
  copyToClipboard(lines.join('\n'));
}

// ── Modals ────────────────────────────────────────────────────────────────────
function openModal()  { document.getElementById('modalBackdrop').classList.add('open'); }
function closeModal() { document.getElementById('modalBackdrop').classList.remove('open'); }

function openHelpModal() {
  document.getElementById('modalBody').innerHTML = `
    <h2>Keyboard shortcuts</h2>
    <div class="kbd-row"><span>Focus search</span><kbd>Ctrl/Cmd + K</kbd></div>
    <div class="kbd-row"><span>Close panel / modal</span><kbd>Esc</kbd></div>
    <div class="kbd-row"><span>Architecture view</span><kbd>1</kbd></div>
    <div class="kbd-row"><span>Infra Diagram</span><kbd>2</kbd></div>
    <div class="kbd-row"><span>Graph</span><kbd>3</kbd></div>
    <div class="kbd-row"><span>Data Flows</span><kbd>4</kbd></div>
    <div class="kbd-row"><span>Endpoints</span><kbd>5</kbd></div>
    <div class="kbd-row"><span>Toggle theme</span><kbd>T</kbd></div>
    <div class="kbd-row"><span>Open export menu</span><kbd>E</kbd></div>
    <div class="kbd-row"><span>This help</span><kbd>?</kbd></div>
    <h3>Diagram / Graph</h3>
    <div class="kbd-row"><span>Pan</span><kbd>Click + drag</kbd></div>
    <div class="kbd-row"><span>Zoom</span><kbd>Scroll wheel</kbd></div>
    <div class="kbd-row"><span>Highlight connected</span><kbd>Click node</kbd></div>
    <div class="kbd-row"><span>Open details</span><kbd>Double-click node</kbd></div>
    <div class="modal-close-row"><button class="secondary" onclick="closeModal()">Close</button></div>`;
  openModal();
}

// ── Keyboard ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (e.key === 'Escape') { closeDetail(); closeModal(); return; }
  if ((e.ctrlKey||e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('searchInput').focus(); return; }
  if (typing) return;
  if (e.key === '?')       openHelpModal();
  else if (e.key === '1')  switchView('architecture');
  else if (e.key === '2')  switchView('diagram');
  else if (e.key === '3')  switchView('graph');
  else if (e.key === '4')  switchView('flows');
  else if (e.key === '5')  switchView('endpoints');
  else if (e.key === 't' || e.key === 'T') toggleTheme();
  else if (e.key === 'e' || e.key === 'E') openExportMenu();
});

init();
</script>
